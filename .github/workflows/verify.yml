name: verify-theory

on:
  push:
    branches: [main]
  pull_request:

jobs:
  symbolic-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/verify_freeze.py
      - run: python scripts/verify_stage4rg_global.py
      - run: python scripts/verify_stage10.py
      - run: python -m pytest -q

  manuscript-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Require PDF
        run: test -s main.pdf
